- name: Configure EKS Monitoring
  hosts: control
  become: yes
  roles:
    - eks-tools
    - docker-monitoring
    - helm-prometheus

  post_tasks:
    - name: Read Grafana LoadBalancer hostname
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - service
          - prometheus-grafana
          - -n
          - monitoring
          - -o
          - jsonpath={.status.loadBalancer.ingress[0].hostname}
      register: grafana_hostname
      changed_when: false

    - name: Show Grafana access information without exposing credentials
      ansible.builtin.debug:
        msg:
          - "Grafana URL: http://{{ grafana_hostname.stdout }}"
          - "Username: admin"
          - "Retrieve the initial password securely from the Kubernetes Secret on the control host; do not print it in shared logs."
